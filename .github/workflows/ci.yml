name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests and Offline RAG Evaluation
    runs-on: ubuntu-latest
    env:
      RAG_MODE: light
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r backend/requirements-dev.txt

      - name: Verify dependency locks and policy
        run: |
          python scripts/verify_dependency_policy.py
          python -m piptools compile --quiet --no-header --resolver=backtracking --strip-extras --output-file=backend/requirements.txt backend/requirements.in
          python -m piptools compile --quiet --no-header --resolver=backtracking --strip-extras --output-file=backend/requirements-full.txt backend/requirements-full.in
          python -m piptools compile --quiet --no-header --resolver=backtracking --strip-extras --output-file=backend/requirements-dev.txt backend/requirements-dev.in
          python -m piptools compile --quiet --no-header --resolver=backtracking --strip-extras --output-file=legacy_streamlit/requirements.txt legacy_streamlit/requirements.in
          git diff --exit-code -- backend/requirements.txt backend/requirements-full.txt backend/requirements-dev.txt legacy_streamlit/requirements.txt

      - name: Audit Python dependencies
        run: |
          python -m pip_audit -r backend/requirements.txt
          python -m pip_audit -r backend/requirements-full.txt --ignore-vuln PYSEC-2026-311 --ignore-vuln CVE-2026-45830 --ignore-vuln CVE-2026-45831 --ignore-vuln CVE-2026-45833

      - name: Check Python syntax
        run: python -m compileall -q backend

      - name: Verify research freeze and private-artifact boundary
        run: python -m backend.v382_release_guard

      - name: Run backend tests
        run: python -m pytest backend -v

      - name: Run public operational smoke
        run: python scripts/v382_public_smoke.py

      - name: Run offline RAG evaluation
        run: python -m backend.evaluation.run

  full-backend-smoke:
    name: Full RAG Dependency and Import Smoke Test
    runs-on: ubuntu-latest
    env:
      RAG_MODE: full
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: backend/requirements-full.txt

      - name: Install full backend dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r backend/requirements-full.txt

      - name: Import full backend
        run: |
          python -c "from backend.main import app; from backend import rag_core; assert app and rag_core.get_persist_dir('kb-ci-smoke-00000001')"

  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  container:
    name: Container Configuration and Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build non-root backend image
        run: docker build --tag industrial-knowledge-rag:ci .
